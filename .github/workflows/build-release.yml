name: Build NextGen Disk Cache

on:
  workflow_dispatch:
  push:
    branches: [ main, "release/**", "agent/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Validate source bundle
        run: python tools/validate_rc.py

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Exercise the actual DLL and cache policy
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package FOMOD
        shell: pwsh
        run: .\package-release.ps1 -SkipBuild

      - name: Upload FOMOD artifact
        uses: actions/upload-artifact@v7
        with:
          name: NextGenDiskCache-2.3.0-FOMOD
          path: |
            dist/NextGenDiskCache-2.3.0-FOMOD.zip
            dist/NextGenDiskCache-2.3.0-SHA256.txt

      - name: Upload symbols separately
        uses: actions/upload-artifact@v7
        with:
          name: NextGenDiskCache-2.3.0-symbols
          path: build/symbols/NextGenDiskCache.pdb
          if-no-files-found: warn
