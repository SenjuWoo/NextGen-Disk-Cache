; NextGen Disk Cache 2.3.0 - ExperimentalWarmCache
; Safe: learned load cache. Each session records which game files and archive ranges Skyrim
;   reads until shortly after the first save load; the next launch reads exactly that data
;   back into the Windows file cache in parallel, before the game asks for it.
; Minimal: everything off, for a controlled comparison. Experimental adds the old archive
;   warmer and wider hooks on top of the load cache.
; The profile (NextGenDiskCache.hotset) and the log live in Documents\My Games\...\SKSE.
; Each log has "Timing:" lines for the data load and every save load - compare a cold boot.

[FileCache]
bEnableFileCacheHooks=1
bEnableCreateFileA=1
bEnableCreateFileW=1
iHookScope=1
bStripNoBuffering=1
bConservativeHookScope=1
bPreferRandomAccessOnArchives=1
bLeaveSequentialOnLogs=1

[Process]
bDisablePowerThrottling=1
bRaiseMemoryPriority=0
bExpandWorkingSet=0
fWorkingSetMaxFraction=0.35
iWorkingSetMinMB=128

[Hardware]
bHardwareProfile=1
bAutoTune=1
bHighEndMode=0
iGameDriveClass=0
bPreferFastCores=0
bPlaceWarmThreadsOnBackgroundCores=1

[HotSet]
; iHotSetBudgetMB: data read ahead at launch; 0 = automatic (1/8 of RAM, 512-4096 MB).
; iHotSetThreads: parallel reads; 0 = by drive (NVMe 4, SATA/unknown 2, hard disk skipped).
; iHotSetRecordSecs: gameplay recorded after the first save load. iHotSetMaxSecs: prefetch deadline.
; iHotSetMaxAge: launches a file may go unread before it leaves the profile.
bHotSetRecord=1
bHotSetPrefetch=1
iHotSetBudgetMB=6144
iHotSetThreads=0
iHotSetRecordSecs=180
iHotSetMaxSecs=180
iHotSetMaxAge=6
bHotSetLowIoPriority=0

[WarmCache]
; Legacy archive warmer (reads the start of every opened archive after DataLoaded).
bEnableWarmCache=1
iWarmCacheDelaySecs=30
iWarmCacheMaxFiles=512
iWarmCacheBytesPerFileMB=128
iWarmCacheBudgetMB=2048
iWarmCacheThreads=1
bWarmCacheMappedPrefetch=0
bWarmCacheLowIoPriority=1
bWarmCacheStridedPrefetch=1
iWarmCacheStrideMB=256
iWarmCacheReserveMB=0
bStopWarmCacheOnMemoryPressure=1
bWarmCacheOnlyObservedArchives=1
iWarmCacheDurationSecs=180
iWarmCacheRateMBps=128

[Log]
bLogToFile=1
bLogEveryOpen=0
bLogStatsOnExit=0
bLogStatsAfterWarm=1
bLogToPluginDirectory=0
