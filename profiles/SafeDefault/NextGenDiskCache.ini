; NextGen Disk Cache 2.2.0 - SafeDefault
; Safe warms archives Skyrim successfully opens, in small paced read-only chunks.
; Minimal disables warming for a controlled comparison. Experimental retains wider hooks.
; Budget is per process session. Rate is aggregate MB/s; tuning can only reduce it.
; Delay starts after SKSE DataLoaded. Save loading and RAM pressure pause reads.
; Set bWarmCacheOnlyObservedArchives=0 only to opt into the legacy Data directory scan.
; Mapped prefetch requests are logged separately from completed buffered reads.

[FileCache]
bEnableFileCacheHooks=1
bEnableCreateFileA=1
bEnableCreateFileW=1
iHookScope=0
bStripNoBuffering=1
bConservativeHookScope=1
bPreferRandomAccessOnArchives=0
bLeaveSequentialOnLogs=1

[Process]
bDisablePowerThrottling=0
bRaiseMemoryPriority=0
bExpandWorkingSet=0
fWorkingSetMaxFraction=0.35
iWorkingSetMinMB=128

[Hardware]
bHardwareProfile=0
bAutoTune=1
bHighEndMode=0
iGameDriveClass=0
bPreferFastCores=0
bPlaceWarmThreadsOnBackgroundCores=0

[WarmCache]
bEnableWarmCache=1
iWarmCacheDelaySecs=15
iWarmCacheMaxFiles=512
iWarmCacheBytesPerFileMB=64
iWarmCacheBudgetMB=1024
iWarmCacheThreads=1
bWarmCacheMappedPrefetch=0
bWarmCacheLowIoPriority=1
bWarmCacheStridedPrefetch=0
iWarmCacheStrideMB=256
iWarmCacheReserveMB=0
bStopWarmCacheOnMemoryPressure=1
bWarmCacheOnlyObservedArchives=1
iWarmCacheDurationSecs=180
iWarmCacheRateMBps=64

[DirectStorage]
bDirectStorageProbe=0
bDirectStorageWarmRead=0
iDirectStorageQueueCapacity=128
iDirectStorageBatchMB=32
iDirectStorageTimeoutMs=30000

[Log]
bLogToFile=1
bLogEveryOpen=0
bLogStatsOnExit=0
bLogStatsAfterWarm=1
bLogToPluginDirectory=0
